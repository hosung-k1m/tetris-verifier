_ > nanoagent.plugin.v0001.ManifestConfig:
id: tetris-verifier
name: "Tetris: No Peek"
version: 0.2.1
status: ready
spec: nanoagent.plugin/v0001
runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]
permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  legal_placements:
    description: Enumerate orientations and columns with their immediate hard-drop boards, row clears, and top-outs.
  play_prefix:
    description: Open the named puzzle with no moves, then append exactly one committed move per call to reveal the next turn.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  play-puzzle:
    description: Play the full AI-only puzzle and display the verified placements in Result. Use stack by default, or split if requested.
    runner: agent
    tools: [play_prefix]
    reference: null
    instructions: |-
      Call play_prefix with the requested puzzle and an empty moves list. It returns the current
      turn and immediate placements. Commit exactly one new move by appending it to the moves list
      and calling play_prefix again with the same puzzle. Repeat until turn is null. Submit the
      exact list of committed moves. Every move is graded independently on its actual starting board.
      Board rows are top first and # is occupied. Orientation counts clockwise quarter turns and
      column is the zero-based left edge. Drops go straight down and full rows clear. Minimize the
      worst terminal cell count (81 for top-out). After each commitment, any remaining piece could
      be revealed. Plan a best response per reveal without assuming the order of the other pieces.
  choose-optimal-move:
    description: Grade one AI placement for an explicitly supplied custom turn.
    runner: agent
    tools: [legal_placements]
    reference: null
    instructions: Submit one placement that minimizes the worst terminal cell count over unknown reveals. Ties pass.
