_ > nanoagent.plugin.v0001.ManifestConfig:
id: tetris-verifier
name: "Tetris: No Peek"
version: 0.2.2
status: ready
spec: nanoagent.plugin/v0001
runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]
permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  legal_placements:
    description: Enumerate orientations and columns with their immediate hard-drop boards, row clears, and top-outs.
  play_prefix:
    description: Open the named puzzle with no moves, then append exactly one committed move per call to reveal the next turn.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  play-puzzle:
    description: Play the full AI-only puzzle and display the verified placements in Result. Use stack by default, or split if requested. Call once per request and report a task error if it fails.
    runner: agent
    tools: [play_prefix]
    reference: null
    instructions: |-
      First call play_prefix with the requested puzzle and moves: []. Then make one tool call
      per turn. If turn is null, immediately call submit with the exact committed moves list
      and finish. Otherwise append one move and call play_prefix again.
      Spend at most 120 words of reasoning per turn. Use the returned rotations directly.
      Their indices are orientations, and each lists its exact shape, available columns, and
      immediate clears. If every column list is empty, commit orientation 0, column 0 to top out.
      Aim to minimize the worst terminal cell count over the unordered remaining pieces.
      Look briefly for line clears and accessible gaps. If you cannot prove the best move quickly,
      commit your best candidate and keep playing. The verifier will calculate exact optimality.
      Completing the puzzle and calling submit is required even if you are unsure of a move.
  choose-optimal-move:
    description: Grade one AI placement for an explicitly supplied custom turn.
    runner: agent
    tools: [legal_placements]
    reference: null
    instructions: Submit one placement that minimizes the worst terminal cell count over unknown reveals. Ties pass.
