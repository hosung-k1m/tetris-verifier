_ > nanoagent.plugin.v0001.ManifestConfig:
id: tetris-verifier
name: "Tetris: No Peek"
version: 0.2.7
status: ready
spec: nanoagent.plugin/v0001
runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]
permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  legal_placements:
    description: Show the resulting board, cleared rows, and top-out status for each drop on a supplied turn.
  play_prefix:
    description: Open the requested puzzle and show up to eight distinct drops. Append one committed move per call to reveal the next turn.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  play-puzzle:
    description: >-
      Play a puzzle when the user says "play the game" or asks to watch the AI play.
      Use stack by default, or split if requested. Show each drop and its optimality
      verdict in Result. Call once per request and report a task error if it fails.
    runner: agent
    tools: [play_prefix]
    reference: null
    instructions: |-
      Open with play_prefix using the requested puzzle and moves: [].
      On each turn, choose one of the listed candidates and immediately call play_prefix with
      that move appended. Compare clears, holes, and height. Spend at most one sentence on the
      choice. Commit a move even when you are unsure. The verifier handles the full search.
      When turn is null, immediately call submit with the exact committed moves and finish.
  choose-optimal-move:
    description: Choose and verify one AI drop for a custom board and bag supplied by the user.
    runner: agent
    tools: [legal_placements]
    reference: null
    instructions: Submit one placement that minimizes the worst terminal cell count over unknown reveals. Ties pass.
